name: Daily pipeline

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC (06:30 in Tunis)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint and unit tests
        run: |
          ruff check src tests
          pytest -q
      - name: Extract, load, transform, quality checks, build dashboard
        run: python -m airpipe
        env:
          PYTHONPATH: src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
